name: CI

# CI gates: typecheck + lint (web) + unit tests across the monorepo.
#
# CD is handled outside this workflow:
#   - Web:    Vercel's git integration builds and deploys apps/web on every push
#             (preview deploys for branches, production for main).
#   - Mobile: EAS builds are triggered manually (`eas build` / `eas submit`),
#             since App Store builds are billed and human-gated.

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    # Nightly E2E run (04:00 UTC) — keeps browser/DB-heavy minutes off every push.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires a DATABASE_URL for `prisma generate`,
      # but generate never opens a connection — a dummy value is enough.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (web)
        run: npm run lint --workspace=web

      - name: Test
        run: npm test

      # The runner is UTC, so date bugs that only bite users east or west of it
      # pass here and fail in production. The demo sandbox is dated relative to
      # "now" and computes week boundaries locally while stamping clock times in
      # UTC, which made it seed time entries for shifts that hadn't happened yet
      # at UTC+14 — green on this runner, wrong for a real visitor in Auckland.
      # Kiritimati (+14) and Midway (-11) are the extremes of the inhabited range.
      - name: Test (timezone extremes)
        run: |
          for tz in Pacific/Kiritimati Pacific/Midway; do
            echo "::group::TZ=$tz"
            TZ=$tz npm test
            echo "::endgroup::"
          done

  # Service-layer tests against a REAL Postgres. The unit suite mocks Prisma, so
  # it asserts the shape of a query and can say nothing about what SQL does with
  # it — which is how `colorTag: { not: "sick" }` shipped: that compiles to
  # `colorTag <> 'sick'`, NULL for uncoloured rows, so they were silently dropped
  # from roll-out and from payroll export. Runs on every push/PR: it is fast, and
  # the bugs it catches are the expensive kind.
  integration:
    runs-on: ubuntu-latest
    # Run the suite under two session timezones.
    #
    #   UTC   — what Neon actually uses. This is the production-parity pass; if
    #           it fails, production is broken.
    #   UTC+14 — the largest real offset. Prisma stores DateTime as `timestamp
    #           WITHOUT time zone`, so raw SQL comparing one against NOW() (a
    #           timestamptz) is wrong by the session offset. Under UTC that
    #           offset is zero and the bug is invisible — which is how
    #           assertSeatAvailable shipped applying seat reductions early with
    #           a green suite.
    #
    # Neither pass alone is enough: UTC proves production works but hides the
    # bug class, UTC+14 exposes the bug class but tests a timezone production
    # never uses.
    strategy:
      fail-fast: false
      matrix:
        include:
          - timezone: "UTC"
            allow_utc: "1"
            label: "production parity (Neon runs UTC)"
          - timezone: "Pacific/Kiritimati"
            allow_utc: "0"
            label: "UTC+14 — exposes naive-vs-timestamptz bugs"
    name: integration (${{ matrix.timezone }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: it
          POSTGRES_PASSWORD: it
          POSTGRES_DB: it
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # lib/prisma.ts always uses the Neon serverless driver, which speaks
      # WebSockets — wsproxy lets it talk to a plain Postgres.
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: "postgres:5432"
          ALLOW_ADDR_REGEX: ".*"
          LOG_TRAFFIC: "true"
        ports: ["5433:80"]
    env:
      DATABASE_URL: postgres://it:it@localhost:5432/it?sslmode=disable
      DIRECT_URL: postgres://it:it@localhost:5432/it?sslmode=disable
      NEON_WS_PROXY: localhost:5433/v1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Apply schema
        working-directory: apps/web
        run: npx prisma migrate deploy

      - name: Set the session timezone — ${{ matrix.label }}
        run: |
          PGPASSWORD=it psql -h localhost -U it -d it \
            -c "ALTER DATABASE it SET TimeZone='${{ matrix.timezone }}';"

      - name: Integration tests
        working-directory: apps/web
        env:
          # Only the UTC pass may opt out of the non-UTC guard; the UTC+14 pass
          # must keep it on, or it silently stops being the check it exists to be.
          ALLOW_UTC_TEST_DB: ${{ matrix.allow_utc }}
        run: npm run test:integration

  # Which paths make the E2E suite worth its minutes on a PR. Server-side auth,
  # billing and rota logic are what the specs actually cover; a CSS change is not.
  changes:
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.filter.outputs.critical }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # No PR context (a bare push, or the nightly): nothing to diff against.
          # Say "not critical" and let the job's own `if` decide — the nightly and
          # workflow_dispatch run E2E regardless, and this repo merges via PRs, so
          # gating on the PR diff is what keeps browser minutes off every push.
          if [ -z "$BASE" ]; then echo "critical=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE \
            '^apps/web/(app/api/|lib/services/|lib/(auth|auth\.config|apiGuard|billing|prisma)\.ts|proxy\.ts|prisma/)|^apps/web/e2e/|^\.github/workflows/'; then
            echo "critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
          fi

  # Browser E2E for the money path (access control, trial paywall, invite claim).
  #
  # Nightly, on demand, AND on any PR that touches the API routes, the service
  # layer, the auth/billing modules or the schema — nightly-only meant a broken
  # checkout or a 403 on the whole app could sit on main for a day, and onboarding
  # had in fact been broken for every new signup for some time before an e2e spec
  # existed to notice. Everything else (styling, copy, components) still waits for
  # the nightly, so the browser minutes stay off routine PRs.
  e2e:
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.critical == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: "postgres:5432"
          ALLOW_ADDR_REGEX: ".*"
          LOG_TRAFFIC: "true"
        ports: ["5433:80"]
    env:
      DATABASE_URL: postgres://e2e:e2e@localhost:5432/e2e?sslmode=disable
      DIRECT_URL: postgres://e2e:e2e@localhost:5432/e2e?sslmode=disable
      NEON_WS_PROXY: localhost:5433/v1
      AUTH_SECRET: e2e-auth-secret
      NEXTAUTH_URL: http://localhost:3000
      E2E_TEST_LOGIN: "1"
      E2E_TEST_PASSWORD: e2e-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/web
        run: npx prisma generate

      - name: Apply schema
        working-directory: apps/web
        run: npx prisma migrate deploy

      - name: Seed E2E data
        working-directory: apps/web
        run: npm run seed:e2e

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e --workspace=web
